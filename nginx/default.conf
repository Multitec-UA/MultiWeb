# ---- One origin, not two (audit item 3.6) ---------------------------------
# https://www.multitecua.com answered 200 with the same bytes as the apex rather than
# redirecting to it — measured 2026-08-29: `curl -I https://www.multitecua.com` returned
# `HTTP/2 200`, no Location. Two live origins for one site split whatever link equity
# the association has and give every share a coin-flip about which hostname it carries.
# The canonical tag says the apex, so this makes the server agree with it.
#
# This block only ever matches a request whose Host header is exactly www.multitecua.com;
# everything else — the apex, dev.multitecua.com, the Cloud Run *.run.app URL, localhost,
# and the container health check — falls through to the default server below and is
# untouched. The scheme is hardcoded https because TLS terminates at Google Frontend, so
# $scheme inside this container is always http and would downgrade the visitor.
server {
    listen       80;
    server_name  www.multitecua.com;
    return       301 https://multitecua.com$request_uri;
}

server {
    listen       80 default_server;
    server_name  _;

    # ---- Compression -------------------------------------------------------
    # Cloud Run does not compress for you and this was simply never switched on:
    # 450 KB of CSS, JS and HTML went over the wire raw on every cold visit.
    # text/html is always compressed by nginx and must not be listed here.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # ---- Cache-busting asset URLs -----------------------------------------
    # /assets/v1/css/style.css is served from /assets/css/style.css on disk.
    #
    # Why a version segment and not ?v=, and not content hashes: this site has no build
    # step, so nothing can rewrite filenames at deploy time, and a query string is the
    # weakest of the three (some intermediaries ignore it when caching). A path segment is
    # a genuinely different URL, which is what makes `immutable` safe to promise.
    #
    # The rule when you touch anything under assets/: bump v1 -> v2 in all four pages in
    # src/, then run tests/update-assets-lock.sh. tests/verify.sh FAILS if assets/ changed
    # and the version did not — that check is the only reason a one-year cache is not a
    # trap here.
    location ~ ^/assets/v[0-9]+/(?<versioned_asset>.+)$ {
        root /usr/share/nginx/html;
        try_files /assets/$versioned_asset =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Unversioned asset URLs still resolve — old links, the og:image a social network has
    # already crawled, anything we missed — but they get a short cache, never a year, so a
    # missed reference can never be poisoned.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # HTML is the map to everything else: it must always be revalidated, or a bumped
        # asset version would never be discovered.
        add_header Cache-Control "no-cache" always;
    }

    # ---- The English tree --------------------------------------------------
    # Spanish first: an unqualified request for anything on this site gets Spanish, and
    # there is deliberately no Accept-Language negotiation and no cookie anywhere in this
    # file. English is a different set of URLs under /en/, reached by tapping a link, so
    # a shared URL always carries the language it was read in and a crawler can index the
    # two of them separately (they point at each other with hreflang).
    #
    # The only thing this block has to add over `location /` is the error page: without
    # it, a missing page under /en/ would answer with the SPANISH 404, which is the one
    # place the language could silently flip on a visitor.
    location /en/ {
        root   /usr/share/nginx/html;
        index  index.html;
        add_header Cache-Control "no-cache" always;
        error_page 404 /en/404.html;
    }

    # /en without the slash is a common hand-typed form and would otherwise 404.
    location = /en {
        return 301 /en/;
    }
    error_page   500 502 503 504  /50x.html;
    error_page 404 /404.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location = /enlaces/ {
        root   /usr/share/nginx/html;
        try_files /enlaces.html =404;
    }

    location = /enlaces {
        root   /usr/share/nginx/html;
        try_files /enlaces.html =404;
    }

    location = /en/enlaces/ {
        root   /usr/share/nginx/html;
        try_files /en/enlaces.html =404;
    }

    location = /en/enlaces {
        root   /usr/share/nginx/html;
        try_files /en/enlaces.html =404;
    }

    location = /stream {
        return 301 https://www.twitch.tv/multitecua;
    }

    location = /stream/ {
        return 301 https://www.twitch.tv/multitecua;
    }

    ssi on;
}
