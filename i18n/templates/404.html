<!DOCTYPE html>
<html lang="{{@lang_tag}}">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{e404_title}}</title>
    <meta name="description" content="{{e404_meta_description}}">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/v5/images/favicon.webp">
    <link rel="stylesheet" href="/assets/v5/css/404.css">
</head>

<body>
    <!-- One symbol, for the language switch below. Same pattern as every other
         page: no icon is fetched from anyone else's server. Font Awesome Free 6
         (icons: CC BY 4.0, fontawesome.com/license/free). -->
    <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false"><defs>
        <symbol id="ic-globe" viewBox="0 0 512 512"><path d="M352 256c0 22.2-1.2 43.6-3.3 64l-185.3 0c-2.2-20.4-3.3-41.8-3.3-64s1.2-43.6 3.3-64l185.3 0c2.2 20.4 3.3 41.8 3.3 64zm28.8-64l123.1 0c5.3 20.5 8.1 41.9 8.1 64s-2.8 43.5-8.1 64l-123.1 0c2.1-20.6 3.2-42 3.2-64s-1.1-43.4-3.2-64zm112.6-32l-116.7 0c-10-63.9-29.8-117.4-55.3-151.6c78.3 20.7 142 77.5 171.9 151.6zm-149.1 0l-176.6 0c6.1-36.4 15.5-68.6 27-94.7c10.5-23.6 22.2-40.7 33.5-51.5C239.4 3.2 248.7 0 256 0s16.6 3.2 27.8 13.8c11.3 10.8 23 27.9 33.5 51.5c11.6 26 20.9 58.2 27 94.7zm-209 0L18.6 160C48.6 85.9 112.2 29.1 190.6 8.4C165.1 42.6 145.3 96.1 135.3 160zM8.1 192l123.1 0c-2.1 20.6-3.2 42-3.2 64s1.1 43.4 3.2 64L8.1 320C2.8 299.5 0 278.1 0 256s2.8-43.5 8.1-64zM194.7 446.6c-11.6-26-20.9-58.2-27-94.6l176.6 0c-6.1 36.4-15.5 68.6-27 94.6c-10.5 23.6-22.2 40.7-33.5 51.5C272.6 508.8 263.3 512 256 512s-16.6-3.2-27.8-13.8c-11.3-10.8-23-27.9-33.5-51.5zM135.3 352c10 63.9 29.8 117.4 55.3 151.6C112.2 482.9 48.6 426.1 18.6 352l116.7 0zm358.1 0c-30 74.1-93.6 130.9-171.9 151.6c25.5-34.2 45.2-87.7 55.3-151.6l116.7 0z"/></symbol>
    </defs></svg>

    <!-- Audit item 4.3. This page used to be four absolutely-positioned boxes hung off the
         middle of the viewport, with no header, no logo and no way back into the site
         except one link; below 800px the decorative hexagons were switched off entirely
         and what a visitor on a phone got was a white screen with "404" on it. It is the
         page people see when a link the association posted has rotted, so it is worth
         looking like the association. Same red, same Ubuntu, same wordmark — and laid out
         in flow, so it survives any width instead of being pinned to one. -->
    <header class="mt-header">
        <a href="{{@home_href}}" aria-label="{{e404_home_aria}}">
            <img src="/assets/v5/images/multitec-logo.webp" alt="{{alt_logo_404}}" class="mt-logo" width="1080" height="200">
        </a>
    </header>

    <main class="mt-main">
        <svg class="hexagons" viewBox="0 0 837 1045" role="img" aria-label="{{e404_hexagons}}" xmlns="http://www.w3.org/2000/svg">
            <path id="Polygon-1" d="M353,9 L626.664028,170 L626.664028,487 L353,642 L79.3359724,487 L79.3359724,170 L353,9 Z" stroke="#a30006" fill="#a30006" stroke-width="6"></path>
            <path id="Polygon-2" d="M78.5,529 L147,569.186414 L147,648.311216 L78.5,687 L10,648.311216 L10,569.186414 L78.5,529 Z" stroke="#BCBFBE" fill="#BCBFBE" stroke-width="6"></path>
            <path id="Polygon-3" d="M773,186 L827,217.538705 L827,279.636651 L773,310 L719,279.636651 L719,217.538705 L773,186 Z" stroke="#a30006" fill="#a30006" stroke-width="6"></path>
            <path id="Polygon-4" d="M639,529 L773,607.846761 L773,763.091627 L639,839 L505,763.091627 L505,607.846761 L639,529 Z" stroke="#BCBFBE" fill="#BCBFBE" stroke-width="6"></path>
            <path id="Polygon-5" d="M281,801 L383,861.025276 L383,979.21169 L281,1037 L179,979.21169 L179,861.025276 L281,801 Z" stroke="#a30006" fill="#a30006" stroke-width="6"></path>
        </svg>

        <div class="message-box">
            <p class="code">404</p>
            <h1 class="title">{{e404_h1}}</h1>
            <p>{{e404_body}}</p>
            <p class="actions">
                <a href="{{@home_href}}" class="link-button">{{e404_back}}</a>
                <a href="{{@join_href}}" class="link-button ghost">{{e404_join}}</a>
            </p>
            <p><a href="{{@alt_href}}" class="lang-switch" hreflang="{{@alt_lang}}" lang="{{@alt_lang}}" aria-label="{{@alt_aria}}"><svg class="ic-fa" aria-hidden="true" focusable="false"><use href="#ic-globe"></use></svg>{{@alt_endonym}}</a></p>
        </div>
    </main>

    <footer class="mt-footer">
        <p><small>{{footer_copy}}</small></p>
    </footer>
</body>

</html>
