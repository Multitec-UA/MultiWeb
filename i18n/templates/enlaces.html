    <main class="enlaces-container">
        <!-- The page's only heading level 1. The logo is the visible title, so this
             is announced and not drawn: without it the outline started at h3. -->
        <h1 class="sr-only">{{enl_h1}}</h1>
        <div class="logo-container">
            <img src="../assets/v9/images/multitec-logo.webp" alt="{{alt_logo_short}}" width="1080" height="200"
                loading="eager">
        </div>

        <p class="description">{{enl_description}}</p>

        <a href="{{@alt_href}}" class="lang-switch" hreflang="{{@alt_lang}}" lang="{{@alt_lang}}" aria-label="{{@alt_aria}}"><svg class="ic-fa" aria-hidden="true" focusable="false"><use href="#ic-globe"></use></svg>{{@alt_endonym}}</a>

        <!-- SECCIÓN 1: INSCRIPCIÓN -->
        <section class="links-container">
            <!-- Audit item 3.1. This pointed at a forms.gle Google Form, which
                 answers 401 to anyone not signed in to the right Google account — measured
                 2026-08-29, and again the same day from this host. It is the single button
                 every visitor arriving from the Instagram bio is meant to press, so the whole
                 conversion path from Instagram was dead. It now goes to the page that takes
                 the payment. -->
            <a href="{{@join_href}}" class="link-item primary" target="_blank" rel="noopener">
                <i class="fa" aria-hidden="true"><svg class="ic-fa"><use href="#ic-user-plus"></use></svg></i> {{enl_cta_join}}
            </a>
        </section>

        <div class="main-sections">
            <!-- SECCIÓN 2: PÁGINA WEB -->
            <section class="section-box">
                <h2 class="section-title">{{enl_section_site}}</h2>
                <a href="{{@home_href}}" class="link-item secondary" target="_blank" rel="noopener">
                    <i class="fa" aria-hidden="true"><svg class="ic-fa"><use href="#ic-globe"></use></svg></i> {{enl_link_site}}
                </a>
            </section>


            <!-- SECCIÓN 4: PODCAST -->
            <section class="section-box">
                <h2 class="section-title">{{enl_section_podcast}}</h2>
                <a href="https://www.youtube.com/@MultitecPodscast" class="link-item secondary" target="_blank"
                    rel="noopener">
                    <i class="fa" aria-hidden="true"><svg class="ic-fa"><use href="#ic-youtube"></use></svg></i> {{enl_link_podcast}}
                </a>
            </section>
        </div>

        <!-- SECCIÓN 5: REDES SOCIALES -->
        <section class="section-box">
            <h2 class="section-title">{{enl_section_social}}</h2>
            <div class="grid-container">
                <a href="https://www.instagram.com/multitecua/" class="link-item" target="_blank" rel="noopener">
                    <i class="fa" aria-hidden="true"><svg class="ic-fa"><use href="#ic-instagram"></use></svg></i> {{enl_link_instagram}}
                </a>

                <a href="https://twitter.com/MultiTecUA" class="link-item" target="_blank" rel="noopener">
                    <i class="fa" aria-hidden="true"><svg class="ic-fa"><use href="#ic-twitter"></use></svg></i> {{enl_link_twitter}}
                </a>

                <a href="https://www.linkedin.com/company/multitecua/" class="link-item" target="_blank" rel="noopener">
                    <i class="fa" aria-hidden="true"><svg class="ic-fa"><use href="#ic-linkedin"></use></svg></i> {{enl_link_linkedin}}
                </a>

                <a href="https://www.youtube.com/channel/UComtzTLqL-jHvRhiQVrzPJg" class="link-item" target="_blank"

                </a>

                <a href="mailto:contacto@multitecua.com" class="link-item">
                    <i class="fa" aria-hidden="true"><svg class="ic-fa"><use href="#ic-envelope"></use></svg></i> {{enl_link_email}}
