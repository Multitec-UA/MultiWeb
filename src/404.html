    <!-- Audit item 4.3. This page used to be four absolutely-positioned boxes hung off the
         middle of the viewport, with no header, no logo and no way back into the site

         and what a visitor on a phone got was a white screen with "404" on it. It is the
         page people see when a link the association posted has rotted, so it is worth
         looking like the association. Same red, same Ubuntu, same wordmark — and laid out
         in flow, so it survives any width instead of being pinned to one. -->
